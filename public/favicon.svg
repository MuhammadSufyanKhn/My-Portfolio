<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGrad)" stroke-width="1.5" fill="none"/>

  <!-- Left Bracket { -->
  <text x="6" y="42" font-family="system-ui, -apple-system, monospace" font-size="28" font-weight="900" fill="#38bdf8">&#123;</text>

  <!-- MSK Text -->
  <text x="32" y="39" text-anchor="middle" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="url(#textGrad)" letter-spacing="0.5">MSK</text>

  <!-- Right Bracket } -->
  <text x="46" y="42" font-family="system-ui, -apple-system, monospace" font-size="28" font-weight="900" fill="#10b981">&#125;</text>

  <!-- Glowing Green Dot -->
  <circle cx="56" cy="11" r="3.5" fill="#10b981"/>
  <circle cx="56" cy="11" r="5" fill="#10b981" fill-opacity="0.3"/>
</svg>
